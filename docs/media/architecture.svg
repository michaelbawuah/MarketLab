<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title description">
  <title id="title">MarketLab runtime boundaries</title>
  <desc id="description">A React interface calls the Worker application, which stores private workspaces and reports in D1. The Worker separately submits signed frozen research snapshots to a Node service with a MongoDB job store, worker threads, C++ risk comparisons, and on-demand independent Python replay.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#267d6a"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:29px;font-weight:700;fill:#17343a}.sub{font-size:17px;fill:#5d7175}.label{font-size:20px;font-weight:700;fill:#17343a}.detail{font-size:16px;fill:#46646a}.tag{font-size:14px;font-weight:700;fill:#267d6a;letter-spacing:1px}.card{fill:#fff;stroke:#c9dcda;stroke-width:1.5}.arrow{fill:none;stroke:#267d6a;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="700" rx="24" fill="#f4f8f7"/>
  <text x="48" y="56" class="title">One interface. Two distinct runtimes.</text>
  <text x="48" y="86" class="sub">D1 owns the app's saved records. MongoDB owns copied research jobs and their results.</text>
  <rect x="34" y="117" width="1208" height="227" rx="18" fill="#e8f2ef"/>
  <text x="54" y="147" class="tag">HOSTED APPLICATION · WORKERS + D1</text>
  <rect x="54" y="169" width="280" height="139" rx="12" class="card"/>
  <text x="76" y="205" class="label">React interface</text>
  <text x="76" y="234" class="detail">Plan · import · compare · share</text>
  <text x="76" y="261" class="detail">Fictional demo without sign-in</text>
  <rect x="446" y="169" width="328" height="139" rx="12" class="card"/>
  <text x="468" y="205" class="label">TypeScript Worker</text>
  <text x="468" y="234" class="detail">Verified identity · owner isolation</text>
  <text x="468" y="261" class="detail">Validation · canonical finance engine</text>
  <rect x="886" y="169" width="336" height="139" rx="12" class="card"/>
  <text x="908" y="205" class="label">D1 / SQLite</text>
  <text x="908" y="234" class="detail">Private workspaces · frozen reports</text>
  <text x="908" y="261" class="detail">Reviewed public-summary links</text>
  <path d="M334 236H432" class="arrow"/>
  <path d="M774 236H872" class="arrow"/>
  <path d="M609 308V402" class="arrow"/>
  <rect x="629" y="350" width="332" height="25" rx="5" fill="#f4f8f7"/>
  <text x="640" y="368" class="detail">Signed request · immutable input copy</text>
  <rect x="34" y="398" width="1208" height="259" rx="18" fill="#e8eef3"/>
  <text x="54" y="431" class="tag">SEPARATE RESEARCH SERVICE · NODE + MONGODB</text>
  <rect x="54" y="459" width="280" height="161" rx="12" class="card"/>
  <text x="76" y="495" class="label">MongoDB job store</text>
  <text x="76" y="524" class="detail">Bounded global / owner admission</text>
  <text x="76" y="551" class="detail">Database-clock leases</text>
  <text x="76" y="578" class="detail">Fenced durable finalization</text>
  <rect x="446" y="459" width="328" height="161" rx="12" class="card"/>
  <text x="468" y="495" class="label">Node API + worker pool</text>
  <text x="468" y="524" class="detail">HMAC authentication · replay checks</text>
  <text x="468" y="551" class="detail">TypeScript accounting / backtests</text>
  <text x="468" y="578" class="detail">Bounded threads · retry recovery</text>
  <rect x="886" y="459" width="336" height="161" rx="12" class="card"/>
  <text x="908" y="495" class="label">Independent checks</text>
  <text x="908" y="524" class="detail">C++ · nine risk comparison groups</text>
  <text x="908" y="551" class="detail">Python · on-demand report replay</text>
  <text x="908" y="578" class="detail">Receipts bound to exact report bytes</text>
  <path d="M446 539H348" class="arrow"/>
  <path d="M774 539H872" class="arrow"/>
  <text x="48" y="683" class="sub">A retried calculation may run again; only the current lease holder can finalize its result.</text>
</svg>
