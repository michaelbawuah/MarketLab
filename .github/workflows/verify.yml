name: Engineering verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0.17
        env:
          MONGO_INITDB_ROOT_USERNAME: test_admin
          MONGO_INITDB_ROOT_PASSWORD: ephemeral-ci-fixture-only
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet -u test_admin -p ephemeral-ci-fixture-only --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_TEST_URI: mongodb://test_admin:ephemeral-ci-fixture-only@127.0.0.1:27017/?authSource=admin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, unit, integration and cross-language gates
        run: pnpm verify:ci
